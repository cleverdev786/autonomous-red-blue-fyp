# T09: opt-in ZAP container, separate from the default MARS Compose stack.
# Image: official ZAP 2.17.0 linux/amd64 manifest, verified 2026-10-27.
services:
  vulnerable-store:
    networks:
      - security-lab
      - zap-target

  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:0075662e5c287cf0a68caebabbfea872e5dc461912ad6d7345fa02a290d0ccb6
    platform: linux/amd64
    profiles: [zap]
    user: "1000:1000"
    read_only: true
    privileged: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    working_dir: /zap
    # No web API, passive scan or active scan in T09. This is a bounded preflight.
    entrypoint: ["/bin/sh", "-c"]
    command: ["command -v zap.sh >/dev/null && exec sleep 180"]
    networks: [zap-target]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/zap/.ZAP:rw,nosuid,size=160m,uid=1000,gid=1000,mode=0700
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 64
    stop_grace_period: 5s
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "command -v zap.sh >/dev/null && kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  zap-target:
    driver: bridge
    internal: true
    attachable: false
