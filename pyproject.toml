[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-red-blue-fyp"
version = "0.1.0"
description = "Controlled multi-agent Red-Blue framework for local web vulnerability detection and remediation research."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "Proprietary - Academic FYP"}
authors = [
  {name = "FYP Team"}
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.10,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "httpx>=0.27,<1.0",
  "GitPython>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "orchestrator*", "schemas*", "services*", "llm*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
